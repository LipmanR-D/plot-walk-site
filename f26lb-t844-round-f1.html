<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Plot Walk</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --muted: #6b6a64;
    --line: #dddbd3; --accent: #2f6b3a; --accent-ink: #ffffff;
    --yes: #2f7d3b; --no: #b23a2e; --warn: #b7791f; --chip: #ecebe5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: 0 16px calc(16px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 10px 0 8px; border-bottom: 1px solid var(--line); }
  .topline { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .study { font-weight: 600; font-size: 15px; }
  .who { font-size: 13px; color: var(--muted); }
  .status { font-size: 13px; margin-top: 4px; display: flex; justify-content: space-between; }
  .saved { color: var(--yes); }
  .bar { height: 6px; background: var(--chip); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); width: 0; }

  .banner { margin: 10px 0; padding: 10px 12px; border-radius: 8px; font-size: 14px;
    background: #fbe9e7; color: #7a1f16; border: 1px solid #e8b4ad; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-top: 12px; }
  .ident { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .ident .full { grid-column: 1 / -1; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .plotno { font-size: 40px; font-weight: 700; line-height: 1.1; }
  .val { font-size: 20px; font-weight: 600; word-break: break-word; }
  .pos { font-size: 13px; color: var(--muted); text-align: right; }

  h2 { font-size: 15px; margin: 18px 0 8px; display: flex; justify-content: space-between; }
  h2 .req { font-weight: 400; font-size: 12px; color: var(--muted); }
  .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pick button { padding: 18px 0; font-size: 20px; font-weight: 700; border-radius: 10px;
    border: 2px solid var(--line); background: var(--card); }
  .pick button.on[data-v="Yes"] { background: var(--yes); border-color: var(--yes); color: #fff; }
  .pick button.on[data-v="No"]  { background: var(--no);  border-color: var(--no);  color: #fff; }
  .grade { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .grade button { padding: 14px 0; font-size: 18px; font-weight: 600; border-radius: 8px;
    border: 2px solid var(--line); background: var(--card); }
  .grade button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  textarea { width: 100%; min-height: 84px; font: inherit; font-size: 16px; padding: 10px;
    border: 2px solid var(--line); border-radius: 8px; background: var(--card); resize: vertical; }

  .nav { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 16px; }
  .nav button { padding: 14px 0; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); font-weight: 600; }
  .nav button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .nav button:disabled { opacity: .4; }

  .actions { margin-top: 20px; display: grid; gap: 8px; }
  .actions button { padding: 14px; border-radius: 10px; font-weight: 600;
    border: 1px solid var(--line); background: var(--card); }
  .actions button.send { background: #1f4e79; color: #fff; border-color: #1f4e79; }
  .small { font-size: 13px; color: var(--muted); text-align: center; margin-top: 10px; }

  .list { margin-top: 12px; }
  .row { display: grid; grid-template-columns: 64px 1fr auto; gap: 8px; align-items: center;
    padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    margin-bottom: 6px; width: 100%; text-align: left; }
  .row .p { font-weight: 700; font-size: 18px; }
  .row .r { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: var(--chip); }
  .tag.Yes { background: var(--yes); color: #fff; } .tag.No { background: var(--no); color: #fff; }
  .tag.inc { background: #fdf0d5; color: var(--warn); }
  .row.current { outline: 3px solid var(--accent); }

  .login { margin-top: 15vh; }
  .login h1 { font-size: 24px; margin: 0 0 4px; }
  .login p { color: var(--muted); margin: 0 0 16px; }
  .login label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
  .login input { width: 100%; font: inherit; font-size: 18px; padding: 12px; border-radius: 8px;
    border: 2px solid var(--line); background: var(--card); }
  .login button { width: 100%; margin-top: 18px; padding: 14px; font-size: 18px; font-weight: 700;
    border: none; border-radius: 10px; background: var(--accent); color: var(--accent-ink); }
  .err { color: var(--no); font-size: 14px; margin-top: 10px; min-height: 1.4em; }
</style>
</head>
<body>

<div id="storageBanner" class="banner hidden">
  <b>This phone is not saving your entries.</b> The browser blocked storage
  (often a private/incognito tab). Do not grade in this tab — tell the organizer.
</div>

<!-- ------------------------------------------------------------ login -->
<section id="loginView" class="login hidden">
  <h1>Plot Walk</h1>
  <p id="loginStudy"></p>
  <form id="loginForm" autocomplete="off">
    <label for="nameInput">Your first name</label>
    <input id="nameInput" autocapitalize="characters" autocorrect="off" spellcheck="false" required>
    <label for="pwInput">Password</label>
    <input id="pwInput" type="password" required>
    <button type="submit">Start</button>
    <div id="loginErr" class="err"></div>
  </form>
</section>

<!-- ------------------------------------------------------------ app -->
<section id="appView" class="hidden">
  <header>
    <div class="topline">
      <div class="study" id="hdrStudy"></div>
      <div class="who" id="hdrWho"></div>
    </div>
    <div class="status">
      <span id="hdrProgress"></span>
      <span id="hdrSaved" class="saved"></span>
    </div>
    <div class="bar"><div id="hdrBar"></div></div>
  </header>

  <div id="plotView">
    <div class="card">
      <div class="ident">
        <div>
          <div class="label">Plot</div>
          <div class="plotno" id="fPlot"></div>
        </div>
        <div class="pos" id="fPos"></div>
        <div class="full">
          <div class="label">RPR / ID</div>
          <div class="val" id="fRpr"></div>
        </div>
        <div class="full">
          <div class="label">Dis Pkg</div>
          <div class="val" id="fDis"></div>
        </div>
      </div>

      <h2>Pick <span class="req">required</span></h2>
      <div class="pick" id="pickBtns">
        <button type="button" data-v="Yes">Yes</button>
        <button type="button" data-v="No">No</button>
      </div>

      <h2>Grade <span class="req">optional · 1 low – 10 high</span></h2>
      <div class="grade" id="gradeBtns"></div>
      <div class="hint">Tap a selected grade again to clear it.</div>

      <h2>Comments <span class="req">optional</span></h2>
      <textarea id="commentBox" placeholder="Anything worth noting about this plot"></textarea>
    </div>

    <div class="nav">
      <button type="button" id="prevBtn">&#8592; Prev</button>
      <button type="button" id="listBtn">All plots</button>
      <button type="button" id="nextBtn" class="primary">Next &#8594;</button>
    </div>
  </div>

  <div id="listView" class="hidden">
    <div class="list" id="plotList"></div>
  </div>

  <div class="actions">
    <button type="button" class="send" id="sendBtn">Send my data</button>
    <button type="button" id="switchBtn">Switch grader</button>
  </div>
  <div class="small" id="footNote"></div>
</section>

const STORE_PREFIX = "plotwalk:v1:" + CONFIG.study + ":";
const SESSION_KEY = STORE_PREFIX + "session";
const KEY_KEY = STORE_PREFIX + "key";
let PLOTS = [];           // filled in by unlock()

let grader = null;        // normalized name
let entries = {};         // plot -> {pick, grade, comment, updated}
let current = 0;          // index into PLOTS
let storageOk = true;

const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- storage
// Every change is written straight to localStorage before anything else
// happens. If storage fails, the banner says so; we never pretend to save.
function storeGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function storeSet(key, value) {
  try { localStorage.setItem(key, value); return true; }
  catch (e) { storageOk = false; $("storageBanner").classList.remove("hidden"); return false; }
}
function checkStorage() {
  const probe = STORE_PREFIX + "probe";
  try {
    localStorage.setItem(probe, "1");
    const ok = localStorage.getItem(probe) === "1";
    localStorage.removeItem(probe);
    if (!ok) throw new Error("readback");
  } catch (e) {
    storageOk = false;
    $("storageBanner").classList.remove("hidden");
  }
  // Ask the browser not to evict our data under storage pressure.
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }
}
function dataKey(name) { return STORE_PREFIX + "data:" + name; }

function loadEntries(name) {
  const raw = storeGet(dataKey(name));
  if (!raw) return {};
  try { return JSON.parse(raw).entries || {}; } catch (e) { return {}; }
}
function saveEntries() {
  const ok = storeSet(dataKey(grader), JSON.stringify({ grader, study: CONFIG.study, entries }));
  $("hdrSaved").textContent = ok ? "✓ saved on this phone" : "NOT SAVED";
  $("hdrSaved").style.color = ok ? "" : "var(--no)";
  return ok;
}
function saveSession() {
  storeSet(SESSION_KEY, JSON.stringify({ grader, current }));
}

// ---------------------------------------------------------------- unlock
// The plot list is AES-GCM ciphertext; the key is derived from the password
// with PBKDF2. A wrong password fails GCM's integrity check, so "decrypts"
// and "password correct" are the same test. Once unlocked, the raw key is
// kept on this phone so a reload resumes without retyping the password.
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function deriveKey(password) {
  const sealed = CONFIG.sealed;
  const base = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: unb64(sealed.salt), iterations: sealed.iter },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function unlock(key) {
  const sealed = CONFIG.sealed;
  try {
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: unb64(sealed.iv) }, key, unb64(sealed.ct));
    PLOTS = JSON.parse(new TextDecoder().decode(plain)).plots;
    return true;
  } catch (e) {
    return false;
  }
}
async function rememberKey(key) {
  // Tied to this build's salt: a rebuilt page with a new password simply
  // fails to unlock with the old key and falls back to the login screen.
  const raw = await crypto.subtle.exportKey("raw", key);
  storeSet(KEY_KEY, JSON.stringify({ salt: CONFIG.sealed.salt, key: tob64(raw) }));
}
async function rememberedKey() {
  let saved = null;
  try { saved = JSON.parse(storeGet(KEY_KEY) || "null"); } catch (e) { saved = null; }
  if (!saved || saved.salt !== CONFIG.sealed.salt) return null;
  try {
    return await crypto.subtle.importKey("raw", unb64(saved.key), "AES-GCM", false, ["decrypt"]);
  } catch (e) { return null; }
}

// ---------------------------------------------------------------- login
function normalizeName(s) {
  return s.trim().replace(/\s+/g, " ").toUpperCase();
}

$("loginForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const name = normalizeName($("nameInput").value);
  if (!name) { $("loginErr").textContent = "Enter your first name."; return; }
  const btn = $("loginForm").querySelector("button");
  btn.disabled = true; btn.textContent = "Unlocking…";
  $("loginErr").textContent = "";
  try {
    const key = await deriveKey($("pwInput").value);
    if (!(await unlock(key))) { $("loginErr").textContent = "Wrong password."; return; }
    await rememberKey(key);
    $("pwInput").value = "";
    startAs(name, 0);
  } finally {
    btn.disabled = false; btn.textContent = "Start";
  }
});

function startAs(name, index) {
  grader = name;
  entries = loadEntries(name);
  current = Math.min(Math.max(index || 0, 0), PLOTS.length - 1);
  saveSession();
  $("loginView").classList.add("hidden");
  $("appView").classList.remove("hidden");
  $("hdrWho").textContent = grader;
  if (storageOk) $("hdrSaved").textContent = "✓ saved on this phone";
  showPlot();
}

$("switchBtn").addEventListener("click", () => {
  if (!confirm("Switch grader? " + grader + "'s entries stay saved on this phone.")) return;
  storeSet(SESSION_KEY, "");
  grader = null;
  $("appView").classList.add("hidden");
  $("loginView").classList.remove("hidden");
  $("nameInput").value = "";
  $("loginErr").textContent = "";
});

// ---------------------------------------------------------------- entry
function entryFor(plot) { return entries[plot] || { pick: "", grade: "", comment: "" }; }
function hasAny(e) { return !!(e && (e.pick || e.grade || (e.comment && e.comment.trim()))); }

function update(field, value) {
  const plot = PLOTS[current].plot;
  const e = Object.assign({}, entryFor(plot));
  e[field] = value;
  e.updated = new Date().toISOString();
  if (hasAny(e)) entries[plot] = e; else delete entries[plot];
  saveEntries();
  renderInputs();
  renderProgress();
}

function buildGradeButtons() {
  const box = $("gradeBtns");
  for (let g = 1; g <= 10; g++) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = g; b.dataset.v = String(g);
    box.appendChild(b);
  }
  box.addEventListener("click", ev => {
    const b = ev.target.closest("button"); if (!b) return;
    const cur = entryFor(PLOTS[current].plot).grade;
    update("grade", cur === b.dataset.v ? "" : b.dataset.v);
  });
  $("pickBtns").addEventListener("click", ev => {
    const b = ev.target.closest("button"); if (!b) return;
    const cur = entryFor(PLOTS[current].plot).pick;
    update("pick", cur === b.dataset.v ? "" : b.dataset.v);
  });
  $("commentBox").addEventListener("input", ev => update("comment", ev.target.value));
}

function renderInputs() {
  const e = entryFor(PLOTS[current].plot);
  for (const b of $("pickBtns").children) b.classList.toggle("on", b.dataset.v === e.pick);
  for (const b of $("gradeBtns").children) b.classList.toggle("on", b.dataset.v === e.grade);
  if (document.activeElement !== $("commentBox")) $("commentBox").value = e.comment || "";
}

function renderProgress() {
  const done = PLOTS.filter(p => entryFor(p.plot).pick).length;
  $("hdrProgress").textContent = done + " / " + PLOTS.length + " picked";
  $("hdrBar").style.width = (100 * done / PLOTS.length) + "%";
}

function showPlot() {
  const p = PLOTS[current];
  $("fPlot").textContent = p.plot;
  $("fRpr").textContent = p.rpr || "—";
  $("fDis").textContent = p.dis || "—";
  $("fPos").textContent = (current + 1) + " of " + PLOTS.length;
  $("prevBtn").disabled = current === 0;
  $("nextBtn").disabled = current === PLOTS.length - 1;
  $("commentBox").value = entryFor(p.plot).comment || "";
  renderInputs();
  renderProgress();
  $("listView").classList.add("hidden");
  $("plotView").classList.remove("hidden");
  $("listBtn").textContent = "All plots";
  saveSession();
  window.scrollTo(0, 0);
}

function go(delta) {
  const next = current + delta;
  if (next < 0 || next >= PLOTS.length) return;
  current = next;
  showPlot();
}
$("prevBtn").addEventListener("click", () => go(-1));
$("nextBtn").addEventListener("click", () => go(1));

// ---------------------------------------------------------------- list
function showList() {
  const box = $("plotList");
  box.textContent = "";
  PLOTS.forEach((p, i) => {
    const e = entryFor(p.plot);
    const row = document.createElement("button");
    row.type = "button";
    row.className = "row" + (i === current ? " current" : "");
    const a = document.createElement("span"); a.className = "p"; a.textContent = p.plot;
    const b = document.createElement("span"); b.className = "r";
    b.textContent = (p.rpr || "—") + (e.grade ? "  ·  grade " + e.grade : "");
    const c = document.createElement("span");
    if (e.pick) { c.className = "tag " + e.pick; c.textContent = e.pick; }
    else if (hasAny(e)) { c.className = "tag inc"; c.textContent = "no pick"; }
    else { c.className = "tag"; c.textContent = "–"; }
    row.append(a, b, c);
    row.addEventListener("click", () => { current = i; showPlot(); });
    box.appendChild(row);
  });
  $("plotView").classList.add("hidden");
  $("listView").classList.remove("hidden");
  const cur = box.children[current];
  if (cur) cur.scrollIntoView({ block: "center" });
}
$("listBtn").addEventListener("click", showList);
document.addEventListener("click", ev => {
  // The list view's own "back" is tapping any row; also allow the header.
  if (ev.target.closest("header") && !$("listView").classList.contains("hidden")) showPlot();
});

// ---------------------------------------------------------------- export
const CSV_COLUMNS = ["Grader", "Study", "Plot", "RPR/ID", "Dis Pkg", "Germplasm",
                     "Pick", "Grade", "Comment", "Updated"];

function csvCell(v) {
  const s = v == null ? "" : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function buildCsv() {
  const lines = [CSV_COLUMNS.join(",")];
  for (const p of PLOTS) {
    const e = entries[p.plot];
    if (!hasAny(e)) continue;
    lines.push([grader, CONFIG.study, p.plot, p.rpr, p.dis, p.germplasm,
                e.pick, e.grade, e.comment, e.updated].map(csvCell).join(","));
  }
  // BOM so Excel opens accented names correctly.
  return "﻿" + lines.join("\r\n") + "\r\n";
}
function stamp() {
  const d = new Date(), z = n => String(n).padStart(2, "0");
  return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + "-" + z(d.getHours()) + z(d.getMinutes());
}
function safeName(s) { return s.replace(/[^A-Za-z0-9._-]+/g, "_"); }

$("sendBtn").addEventListener("click", async () => {
  const count = Object.keys(entries).length;
  if (!count) { alert("Nothing entered yet."); return; }
  const fileName = safeName(CONFIG.study + "_" + grader + "_" + stamp()) + ".csv";
  const csv = buildCsv();
  const file = new File([csv], fileName, { type: "text/csv" });
  const title = "Plot walk - " + CONFIG.study + " - " + grader;
  const text = grader + ": " + count + " plots graded in " + CONFIG.study + ".";

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title, text });
      $("footNote").textContent = "Shared " + fileName;
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;  // user closed the share sheet
      // anything else: fall through to download
    }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.href = url; a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  $("footNote").textContent = "Saved " + fileName + " to Downloads — send that file to the organizer.";
});

// ---------------------------------------------------------------- boot
checkStorage();
buildGradeButtons();
document.title = "Plot Walk – " + CONFIG.study;
$("loginStudy").textContent = CONFIG.study;
$("hdrStudy").textContent = CONFIG.study;

(async function resume() {
  if (!(window.crypto && crypto.subtle)) {
    // WebCrypto exists only in secure contexts (https, or a local file).
    $("loginView").classList.remove("hidden");
    $("loginForm").querySelector("button").disabled = true;
    $("loginErr").textContent = "This browser cannot unlock the page. Open it from its https:// link.";
    return;
  }
  const raw = storeGet(SESSION_KEY);
  let s = null;
  try { s = raw ? JSON.parse(raw) : null; } catch (e) { s = null; }
  const key = s && s.grader ? await rememberedKey() : null;
  if (key && await unlock(key)) startAs(s.grader, s.current);
  else $("loginView").classList.remove("hidden");
})();
</script>
